<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON STRIKE</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080c12;font-family:Impact,"Arial Black",sans-serif;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%}.ui{position:absolute;inset:0;pointer-events:none;color:#fff}.top{position:absolute;left:24px;right:24px;top:18px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:21px;letter-spacing:3px;text-shadow:0 2px #000}.brand b{color:#dfff32}.stats{display:flex;gap:10px}.pill{min-width:100px;background:rgba(8,12,18,.82);border:1px solid rgba(223,255,50,.25);border-radius:5px;padding:8px 12px;font-family:Arial,sans-serif;font-weight:800}.label{font-size:9px;color:#9aa3aa;letter-spacing:1.5px}.value{font-size:20px;margin-top:2px}.cross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%, -50%);border:1.5px solid rgba(223,255,50,.9);border-radius:50%}.cross:before,.cross:after{content:"";position:absolute;background:#dfff32}.cross:before{width:6px;height:1.5px;left:-8px;top:8px}.cross:after{height:6px;width:1.5px;left:8px;top:-8px}.health{position:absolute;left:24px;bottom:24px;width:220px}.healthrow{display:flex;justify-content:space-between;font:800 11px Arial;margin-bottom:6px}.bar{height:9px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.18);transform:skewX(-12deg);overflow:hidden}.fill{height:100%;background:#dfff32;width:100%;transition:width .15s}.ammo{position:absolute;right:24px;bottom:18px;text-align:right}.ammo .num{font-size:44px;line-height:.9;text-shadow:3px 3px #000}.ammo .weapon{font:800 10px Arial;color:#b7bdc4;letter-spacing:2px}.wave{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:34px;letter-spacing:6px;text-shadow:0 3px 8px #000;opacity:0;transition:opacity .25s}.hit{position:absolute;inset:0;background:radial-gradient(circle,transparent 55%,rgba(255,38,38,.6));opacity:0}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,12,.72);pointer-events:auto;text-align:center}.card{border-left:3px solid #dfff32;padding:18px 38px;background:rgba(8,12,18,.88)}.card h1{font-size:52px;letter-spacing:5px;margin:0}.card p{font:700 13px Arial;color:#bbc3c8}.card button{pointer-events:auto;border:0;background:#dfff32;color:#111;font:900 14px Arial;padding:13px 24px;margin-top:8px;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}.hidden{display:none}.joystick{position:absolute;left:25px;bottom:65px;width:110px;height:110px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.12);display:none}.stick{position:absolute;width:48px;height:48px;border-radius:50%;left:31px;top:31px;background:rgba(223,255,50,.22);border:1px solid rgba(223,255,50,.5)}.firebtn{position:absolute;right:24px;bottom:100px;width:82px;height:82px;border-radius:50%;border:2px solid rgba(223,255,50,.5);background:rgba(223,255,50,.12);display:none;align-items:center;justify-content:center;font:900 12px Arial;color:#dfff32}.reload{position:absolute;right:125px;bottom:28px;width:60px;height:60px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;font:900 10px Arial}@media(pointer:coarse){.joystick,.firebtn,.reload{display:flex}.health{bottom:18px}.cross{display:none}}
</style></head>
<body><canvas id="c"></canvas><div class="ui"><div class="top"><div class="brand">NEON <b>STRIKE</b></div><div class="stats"><div class="pill"><div class="label">SCORE</div><div class="value" id="score">0000</div></div><div class="pill"><div class="label">THREAT</div><div class="value" id="kills">0 / 10</div></div></div></div><div class="cross"></div><div class="wave" id="wave">WAVE 1</div><div class="hit" id="hit"></div><div class="health"><div class="healthrow"><span>VITALITY</span><span id="hptext">100</span></div><div class="bar"><div class="fill" id="hp"></div></div></div><div class="ammo"><div class="weapon">VX-9 CARBINE</div><div class="num"><span id="ammo">30</span><small style="font-size16px;color:#839"> / 120</small></div></div><div class="joystick" id="joy"><div class="stick" id="stick"></div></div><div class="firebtn" id="fire">FIRE</div><div class="reload" id="reload">R</div><div class="overlay" id="menu"><div class="card"><h1 id="title">NEON STRIKE</h1><p id="sub">Eliminate all hostiles. Stay moving.</p><button id="start">DEPLOY</button></div></div></div>
<script>
(()=>{
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={},mouse={x:0,y:0,down:false};let running=false,gameOver=false,score=0,kills=0,wave=1,ammo=30,reserve=120,reloadTimer=0,shake=0,last=0;
addEventListener('keydown',e=>{keys[e.key.toLower]=true;if(e.key.toLower&&e.key.toLower()=='r')reload()} );addEventListener('keyup',e=>keys[e.key.toLower]=false);canvas.addEventListener('mousemove',e=>{mouse.x=e.clientX-W/2;mouse.y=e.clientY-H/2});canvas.addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);canvas.addEventListener('contextmenu',e=>e.preventDefault());
const player={x:0,y:0,a:0,hp:100,r:14,fire:0,inv:0};let enemies=[],bullets=[],particles=[];
function spawnWave(){let n=7+wave*3;if(kills>=waveTarget){}kills=0;waveTarget=n;enemies=[];for(let i=0;i<n;i++){let a=Math.random()*6.28,d=300+Math.random()*280;enemies.push({x:player.x+Math.cos(a)*d,y:player.y+Math.sin(a)*d,hp:30+wave*8,max:30+wave*8,r:16,fire:Math.random()*1.5,hit:0,a:0,st:Math.random()*6})}document.getElementById('kills').textContent='0 / '+n;let w=document.getElementById('wave');w.textContent='WAVE '+wave;w.style.opacity=1;setTimeout(()=>w.style.opacity=0,1600)}
let waveTarget=10;
function reset(){score=0;kills=0;wave=1;ammo=30;reserve=120;player.x=0;player.y=0;player.hp=100;bullets=[];particles=[];spawnWave();updateHUD()}
function reload(){if(ammo==30||reserve<=0||reloadTimer)return;reloadTimer=1.25}
function updateHUD(){document.getElementById('score').textContent=String(score).padStart(4,'0');document.getElementById('ammo').textContent=ammo;document.getElementById('hp').style.width=Math.max(0,player.hp)+'%';document.getElementById('hptext').textContent=Math.ceil(player.hp)}
function start(){document.getElementById('menu').classList.add('hidden');running=true;gameOver=false;reset();last=performance.now()}
document.getElementById('start').onclick=start;
function fire(){if(ammo<=0){reload();return}if(player.fire>0)return;player.fire=.11;ammo--;let a=player.a,s=850;bullets.push({x:player.x+Math.cos(a)*24,y:player.y+Math.sin(a)*24,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1.1,enemy:false});for(let i=0;i<3;i++)particles.push({x:player.x+Math.cos(a)*25,y:player.y+Math.sin(a)*25,vx:Math.cos(a)*150+(Math.random()-0.5)*100,vy:Math.sin(a)*150+(Math.random()-0.5)*100,life:.12,color:'#dfff32'});updateHUD()}
function enemyFire(e){let a=Math.atan2(player.y-e.y,player.x-e.x);bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*390,vy:Math.sin(a)*390,life:2.5,enemy:true})}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function update(dt){if(!running)return;if(reloadTimer){reloadTimer-=dt;if(reloadTimer<=0){reloadTimer=0;let n=Math.min(30-ammo,reserve);ammo+=n;reserve-=n;updateHUD()}}player.fire-=dt;player.inv-=dt;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let joy=touchJoy();dx+=joy.x;dy+=joy.y;if(dx||dy){let l=Math.hypot(dx,dy);dx/=l;dy/=l;player.x+=dx*230*dt;player.y+=dy*230*dt}player.a=Math.atan2(mouseWorld().y-player.y,mouseWorld().x-player.x);if(mouse.down||touchFire)fire();player.x=Math.max(-520,Math.min(520,player.x));player.y=Math.max(-520,Math.min(520,player.y));
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.hit-=dt;e.a=Math.atan2(player.y-e.y,player.x-e.x);let d=dist(e,player);if(d>210){e.x+=Math.cos(e.a)*90*dt;e.y+=Math.sin(e.a)*90*dt}else if(d<150){e.x-=Math.cos(e.a)*55*dt;e.y-=Math.sin(e.a)*55*dt}e.fire-=dt;if(d<520&&e.fire<=0){enemyFire(e);e.fire=.8+Math.random()*1.1}}for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0){bullets.splice(i,1);continue}if(!b.enemy){for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){b.life=-1;e.hp-=25;e.hit=.12;for(let k=0;k<5;k++)particles.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*180,vy:(Math.random()-0.5)*180,life:.35,color:'#ff4d55'});if(e.hp<=0){enemies.splice(j,1);kills++;score+=100;document.getElementById('kills').textContent=kills+' / '+waveTarget;updateHUD();if(kills>=waveTarget){wave++;setTimeout(()=>{if(running){spawnWave()}},900)}}break}}}else if(Math.hypot(b.x-player.x,b.y-player.y)<player.r+4&&player.inv<=0){b.life=-1;player.hp-=9;player.inv=.12;shake=7;let h=document.getElementById('hit');h.style.opacity=.7;setTimeout(()=>h.style.opacity=0,90);updateHUD();if(player.hp<=0)end()}}bullets=bullets.filter(b=>b.life>0);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}shake*=.86}
function end(){running=false;gameOver=true;let m=document.getElementById('menu');m.classList.remove('hidden');document.getElementById('title').textContent='K.I.A.';document.getElementById('sub').textContent='Score '+score+'  •  Wave '+wave;document.getElementById('start').textContent='REDEPLOY'}
function mouseWorld(){let cx=W/2-sx,cy=H/2-sy;return{x:player.x+(mouse.x-cx),y:player.y+(mouse.y-cy)}}let sx=0,sy=0;
function project(x,y){return{x:W/2+(x-player.x)*1+(sx),y:H/2+(y-player.y)*1+(sy)}}
function roundRect(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#11171d';ctx.fillRect(0,0,W,H);let jx=(Math.random()-.5)*shake,jy=(Math.random()-.5)*shake;sx=jx;sy=jy;ctx.save();ctx.translate(jx,jy);
// perspective grid
let p=project(0,0);ctx.strokeStyle='rgba(105,125,130,.12)';ctx.lineWidth=1;let gs=64,startX=(-540-Math.floor(player.x/gs)*gs);for(let x=-800;x<800;x+=gs){let a=project(x,-800),b=project(x,800);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}for(let y=-800;y<800;y+=gs){let a=project(-800,y),b=project(800,y);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
// arena border
ctx.strokeStyle='rgba(223,255,50,.18)';ctx.lineWidth=3;let tl=project(-540,-540),br=project(540,540);ctx.strokeRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);
// cover blocks
ctx.fillStyle='#1a2228';ctx.strokeStyle='#3a464b';ctx.lineWidth=2;for(let [x,y,w,h] of [[-380,-280,80,55],[280,-330,90,55],[-210,190,110,48],[330,220,65,90],[-420,320,55,65],[180,-80,70,50]]){let q=project(x,y);ctx.fillRect(q.x,q.y,w,h);ctx.strokeRect(q.x,q.y,w,h);ctx.fillStyle='#dfff32';ctx.fillRect(q.x+8,q.y+h-5,Math.min(30,w-16),2);ctx.fillStyle='#1a2228'}
// enemies
for(let e of enemies){let q=project(e.x,e.y);ctx.save();ctx.translate(q.x,q.y);ctx.rotate(e.a+Math.PI/2);ctx.fillStyle=e.hit>0?'#fff':'#e43d45';ctx.beginPath();ctx.moveTo(-12,-15);ctx.lineTo(12,-15);ctx.lineTo(18,12);ctx.lineTo(0,19);ctx.lineTo(-18,12);ctx.closePath();ctx.fill();ctx.fillStyle='#ff6b70';ctx.fillRect(-6,-16,12,5);ctx.fillStyle='#1a1114';ctx.fillRect(-3,-10,6,24);ctx.restore();ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(q.x-18,q.y-31,36,4);ctx.fillStyle='#ff4d55';ctx.fillRect(q.x-18,q.y-31,36*Math.max(0,e.hp/e.max),4)}
// player
let q=project(player.x,player.y);ctx.save();ctx.translate(q.x,q.y);ctx.rotate(player.a+Math.PI/2);ctx.fillStyle='#dfff32';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(14,12);ctx.lineTo(5,16);ctx.lineTo(0,10);ctx.lineTo(-5,16);ctx.lineTo(-14,12);ctx.closePath();ctx.fill();ctx.fillStyle='#20272b';ctx.beginPath();ctx.arc(0,2,8,0,7);ctx.fill();ctx.fillStyle='#dfff32';ctx.fillRect(-3,-24,6,15);ctx.restore();ctx.fillStyle='rgba(223,255,50,.12)';ctx.beginPath();ctx.arc(q.x,q.y,24,0,7);ctx.fill();
// shots
for(let b of bullets){let q=project(b.x,b.y);ctx.fillStyle=b.enemy?'#ff4d55':'#dfff32';ctx.beginPath();ctx.arc(q.x,q.y,b.enemy?4:3,0,7);ctx.fill()}for(let p of particles){let q=project(p.x,p.y);ctx.globalAlpha=Math.min(1,p.life*4);ctx.fillStyle=p.color;ctx.fillRect(q.x-2,q.y-2,4,4)}ctx.globalAlpha=1;ctx.restore();
// vignette
let g=ctx.createRadialGradient(W/2,H/2,150,W/2,H/2,Math.max(W,H)*.72);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.48)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
// mobile controls
let touchJoyV={x:0,y:0},touchFire=false;const joy=document.getElementById('joy'),stick=document.getElementById('stick');let jid=null;joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)joyMove(e)});function joyMove(e){let r=joy.getBoundingRect();let x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),l=Math.hypot(x,y),m=38;if(l>m){x=x/l*m;y=y/l*m}stick.style.transform=`translate(${x}px,${y}px)`;touchJoyV={x:x/m,y:y/m}}function endJoy(){jid=null;touchJoyV={x:0,y:0};stick.style.transform=''}joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);const fireb=document.getElementById('fire');fireb.addEventListener('pointerdown',e=>{touchFire=true;e.prevent;fireb.setPointerCapture(e.pointerId)});fireb.addEventListener('pointerup',()=>touchFire=false);fireb.addEventListener('pointercancel',()=>touchFire=false);document.getElementById('reload').onclick=reload;function touchJoy(){return touchJoyV}
})();
</script></body></html>
